name: Release

# Builds Fetchly for Windows (installer and portable zip) and Linux (AppImage), plus the browser extension zip,
# tests each build, and publishes them together as one GitHub Release.
# Runs when the version in fetchly/__init__.py changes on main (or when a v* tag is pushed).
# To release: raise __version__ (and "version" in extension/manifest.json), commit, push.
#
# Code signing (SignPath Foundation): the signing steps run only once the repository has the secret
# SIGNPATH_API_TOKEN and the variable SIGNPATH_ORGANIZATION_ID. Until then releases are built unsigned.
# Each signing request must be approved by hand in SignPath; see CODE_SIGNING_POLICY.md.
on:
  push:
    branches: [main]
    paths: ["fetchly/__init__.py"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT: fetchly
      SIGNPATH_POLICY: release-signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          pip install -r requirements.txt pyinstaller pillow
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }

      - name: Run tests
        run: python -m tests.test_engine

      - name: Build Fetchly.exe
        run: |
          python tools/sync_version.py
          python tools/make_assets.py
          python -m PyInstaller --noconfirm --clean --windowed --name Fetchly `
            --icon assets\fetchly.ico --version-file packaging\version_info.txt `
            --add-data "fetchly\ui\assets;fetchly\ui\assets" `
            --exclude-module tkinter --exclude-module unittest --exclude-module pydoc `
            --exclude-module PySide6.QtNetwork --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick `
            main.py
          Copy-Item -Recurse extension dist\Fetchly\extension
          Copy-Item packaging\THIRD-PARTY-NOTICES.txt, LICENSE dist\Fetchly\

      - name: Read version
        run: |
          $v = python -c "import fetchly; print(fetchly.__version__)"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ---- sign Fetchly.exe before it goes into the installer and portable zip -------------------
      - name: Upload app for signing
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != ''
        id: unsigned-app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: dist/Fetchly/Fetchly.exe
          if-no-files-found: error

      - name: Sign Fetchly.exe
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app
          parameters: |
            version: "${{ env.VERSION }}"

      - name: Use the signed Fetchly.exe
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != ''
        run: |
          Get-ChildItem signed-app -Filter *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath signed-app -Force }
          $exe = Get-ChildItem signed-app -Recurse -Filter Fetchly.exe | Select-Object -First 1
          if (-not $exe) { throw "Signed Fetchly.exe not found" }
          Copy-Item $exe.FullName dist\Fetchly\Fetchly.exe -Force
          $sig = Get-AuthenticodeSignature dist\Fetchly\Fetchly.exe
          if ($sig.Status -ne "Valid") { throw "Fetchly.exe signature is $($sig.Status)" }
          "Fetchly.exe signed by: $($sig.SignerCertificate.Subject)"

      - name: Build installer
        run: |
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsis) { $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          Push-Location packaging
          & $nsis /V2 "/DSRCDIR=..\dist\Fetchly" "/DOUTFILE=..\dist\Fetchly-Windows-Setup.exe" "/DVERSION=${env:VERSION}" installer.nsi
          Pop-Location

      # ---- sign the installer ------------------------------------------------------------------------
      - name: Upload installer for signing
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != ''
        id: unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/Fetchly-Windows-Setup.exe
          if-no-files-found: error

      - name: Sign installer
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer
          parameters: |
            version: "${{ env.VERSION }}"

      - name: Use the signed installer
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != ''
        run: |
          Get-ChildItem signed-installer -Filter *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath signed-installer -Force }
          $exe = Get-ChildItem signed-installer -Recurse -Filter "Fetchly-Windows-Setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "Signed installer not found" }
          Copy-Item $exe.FullName "dist\Fetchly-Windows-Setup.exe" -Force
          $sig = Get-AuthenticodeSignature "dist\Fetchly-Windows-Setup.exe"
          if ($sig.Status -ne "Valid") { throw "Installer signature is $($sig.Status)" }
          "Installer signed by: $($sig.SignerCertificate.Subject)"

      - name: Build zips
        run: |
          Compress-Archive -Path dist\Fetchly -DestinationPath "dist\Fetchly-Windows-Portable.zip"
          Compress-Archive -Path extension\* -DestinationPath "dist\Fetchly-Browser-Extension.zip"

      - name: Smoke test the built app
        run: |
          $p = Start-Process -FilePath dist\Fetchly\Fetchly.exe -ArgumentList "--tray" -PassThru
          Start-Sleep -Seconds 15
          $r = Invoke-RestMethod http://127.0.0.1:7614/ping
          if ($r.app -ne "Fetchly") { throw "app did not respond" }
          Stop-Process -Id $p.Id

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Fetchly-Windows-Setup.exe
            dist/Fetchly-Windows-Portable.zip
            dist/Fetchly-Browser-Extension.zip
          if-no-files-found: error

  linux:
    # Built on the oldest supported Ubuntu so the AppImage runs on Ubuntu 22.04 and anything newer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          # Qt's X11 libraries (bundled into the AppImage) and a virtual display for the smoke test
          sudo apt-get install -y -qq libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxkbcommon-x11-0 libegl1 xvfb
          pip install -r requirements.txt pyinstaller pillow
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Run tests
        run: python -m tests.test_engine
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build AppImage
        run: PYTHON=python APPIMAGETOOL=./appimagetool packaging/build_linux.sh
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Smoke test the AppImage
        run: |
          export HOME=$(mktemp -d)
          xvfb-run -a dist/Fetchly-Linux-x86_64.AppImage --appimage-extract-and-run --tray > app.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:7614/ping | grep -q '"app": "Fetchly"'; then echo "Fetchly is running"; exit 0; fi
            sleep 1
          done
          cat app.log
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/Fetchly-Linux-x86_64.AppImage
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        run: echo "VERSION=$(python3 -c 'import fetchly; print(fetchly.__version__)')" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Fetchly ${{ env.VERSION }}
          body_path: packaging/RELEASE_NOTES.md
          files: |
            dist/Fetchly-Windows-Setup.exe
            dist/Fetchly-Windows-Portable.zip
            dist/Fetchly-Linux-x86_64.AppImage
            dist/Fetchly-Browser-Extension.zip
